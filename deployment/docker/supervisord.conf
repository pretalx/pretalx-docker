[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
logfile=/tmp/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; Only runs when REDIS_BUNDLED is set to "yes"; deployments using an external
; Redis leave it stopped. The entrypoint normalises REDIS_BUNDLED to
; true/false for this.
[program:redis]
command=/usr/local/bin/pretalx redis
autostart=%(ENV_REDIS_AUTOSTART)s
autorestart=true
priority=1
user=pretalxuser
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:pretalxweb]
command=/usr/local/bin/pretalx webworker
autostart=true
autorestart=true
priority=5
user=pretalxuser
environment=HOME=/pretalx

[program:pretalxtask]
command=/usr/local/bin/pretalx taskworker
autostart=true
autorestart=true
priority=5
user=pretalxuser
